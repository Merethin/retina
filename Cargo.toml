[package]
name = "retina"
version = "0.1.0"
edition = "2024"

[dependencies]
async-stream = "0.3.6"
axum = { version = "0.8.9", features = [ "macros" ] }
caramel = { path = "./caramel", features = [ "log", "ns", "akari" ] }
dotenv = "0.15.0"
futures-util = "0.3.32"
lapin = "3.7.2"
lazy_static = "1.5.0"
log = { version = "0.4.29", features = [ "max_level_debug", "release_max_level_info" ] }
serde = "1.0.228"
serde_json = "1.0.150"
sqlx = { version = "0.8.6", features = [ "postgres", "runtime-tokio" ] }
tokio = { version = "1.52.3", features = [ "full" ] }
