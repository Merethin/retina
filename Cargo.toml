[package]
name = "retina"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
async-graphql = "7.2.1"
async-graphql-axum = "7.2.1"
async-stream = "0.3.6"
axum = { version = "0.8.9", features = [ "macros" ] }
caramel = { path = "./caramel", features = [ "log", "ns", "akari" ] }
clap = { version = "4.6.6", features = ["derive"] }
csv = "1.4.0"
dotenv = "0.15.0"
futures-util = "0.3.32"
im = "15.1.0"
lapin = "3.7.2"
lazy_static = "1.5.0"
log = { version = "0.4.29", features = [ "max_level_debug", "release_max_level_info" ] }
serde = "1.0.228"
serde_json = "1.0.150"
sqlx = { version = "0.8.6", features = [ "postgres", "runtime-tokio" ] }
string-interner = "0.20.0"
tokio = { version = "1.52.3", features = [ "full" ] }
